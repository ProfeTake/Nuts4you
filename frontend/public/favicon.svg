      <circle cx="30" cy="27" r="1.4"/>
      <circle cx="38" cy="24" r="1.4"/>
      <circle cx="26" cy="40" r="1.5"/>
      <circle cx="33" cy="36" r="1.4"/>
      <circle cx="38" cy="43" r="1.5"/>
      <circle cx="30" cy="47" r="1.4"/>
      <circle cx="24" cy="46" r="1.3"/>
    </g>
